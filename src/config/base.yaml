download:
  download_dir: "~/Downloads"

logging:
  level: INFO
  dir: output/logs

# Choose one or more write targets: neon_db, influx_db, pi_db
# Examples:
#   write_db: [neon_db]
#   write_db: [influx_db]
#   write_db: [pi_db]
#   write_db: [neon_db, influx_db, pi_db]
write_db: [pi_db, neon_db]


eml:
  base_url: "https://ithelpdesk-ugml.sg4.quickconnect.to"
  charge_folder_path: "/V-Optimaise Data/BF2 AUTO REPORTS/CHARGE AND DUMP/HOURLY"
  profiles:
    profile_1:
      user: ${EML_PROFILE_1_USER}
      password: ${EML_PROFILE_1_PASSWORD}
      file_station_search_path: "/V-Optimaise Data/"
      modes: [charge, dpr, rm_strength, rm_stock, ash]
    profile_2:
      user: ${EML_PROFILE_2_USER}
      password: ${EML_PROFILE_2_PASSWORD}
      file_station_search_path: "/QC_LAB_DATA"
      modes: [rm, fines_analysis, hot_metal, dust]

monitor:
  poll_interval_seconds: 60
  stability_delay_seconds: 10
  state_path: "output/state/synology_monitor_state.json"
  process_initial_snapshot: false
  request_timeout_seconds: 30
  download_timeout_seconds: 300
  retry_attempts: 3
  retry_backoff_seconds: 5

# Stable identifiers used to find portal files. Text after these identifiers
# (financial year, month, revision, and extension) may change freely.
portal_files:
  rm: "BF-02 BUNKER"
  rm_sinter: "BF-01 BUNKER"
  fines_analysis: "BF-02 BUNKER"
  dpr: "BF-02 DPR"
  hot_metal: "BF-02- HOT METAL, SLAG"
  rm_strength_coke: "01 COKE OVEN"
  rm_strength_sinter: "02 SP-02 PRODUCT"
  rm_stock: "RM BULK STOCK"
  rm_stock_sinter: "DPR SP#2"
  dust_basic: "BF-02 BUNKER"
  dust_chemical: "GCP DUST CATCHER"
  ash: "ASH ANALYSIS"


influxdb:
  url: https://eu-central-1-1.aws.cloud2.influxdata.com
  org: Blast Furnace, Evonith
  bucket: "bf2_evonith_offline_utc"
  online_bucket: "bf2_evonith_raw"
  token: ${INFLUX_TOKEN}       
  online_token: ${INFLUX_ONLINE_TOKEN}
  timestamp_col: date


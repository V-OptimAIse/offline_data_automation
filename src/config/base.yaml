download:
  download_dir: "~/Downloads"
  metadata_path: "downloaded_metadata.json"   # keep same filename (easy migration)
  default_timeout: 180

logging:
  level: INFO
  dir: output/logs

# Choose one or more write targets: neon_db, influx_db, pi_db
# Examples:
#   write_db: [neon_db]
#   write_db: [influx_db]
#   write_db: [pi_db]
#   write_db: [neon_db, influx_db, pi_db]
write_db: [ influx_db, pi_db, neon_db ]


eml:

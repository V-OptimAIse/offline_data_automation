rm:
  output:
    dir: output/rm
    filename: rm_processed_data.xlsx

  run_date_format: "%d-%b-%Y"

  shifts:
    valid: [A, B, C]
    priority: {C: 0, A: 1, B: 2}
    time:     {A: "07:00", B: "15:00", C: "23:00"}

  invalid_markers: [STOP, "N/A", NA, n/a, na, "-", ""]

  neon:
    schema: offline_feed
    upsert_mode: update_insert
    conflict_cols: [material_code, date_time]
    material_master:
      schema: plant_master
      table: materials
      code_column: material_code
      active_column: is_active
    category_map:
      "fuel coke online":      {table: fuel_chemistry,   material_code: coke_1}
      "fuel coke offline":     {table: fuel_chemistry,   material_code: coke_2}
      "fuel nut coke online":  {table: fuel_chemistry,   material_code: nut_coke_1}
      "fuel nut coke offline": {table: fuel_chemistry,   material_code: nut_coke_2}
      "fuel pci":              {table: fuel_chemistry,   material_code: pci_1}

      "flux 1":                {table: flux_chemistry,   material_code: flux_1}
      "flux 2":                {table: flux_chemistry,   material_code: flux_2}
      "flux 3":                {table: flux_chemistry,   material_code: flux_3}

      "sinter sp 02 offline":  {table: sinter_chemistry, material_code: sinter_4}
      "sinter sp 01 offline":  {table: sinter_chemistry, material_code: sinter_2}

      "ore 1":                 {table: ore_chemistry,    material_code: ore_1}
      "ore 2":                 {table: ore_chemistry,    material_code: ore_2}
      "ore 3":                 {table: ore_chemistry,    material_code: ore_3}
      "ore 4":                 {table: ore_chemistry,    material_code: ore_4}
      "ore 5":                 {table: ore_chemistry,    material_code: ore_5}
      "ore 6":                 {table: ore_chemistry,    material_code: ore_6}
      "ore 7":                 {table: ore_chemistry,    material_code: ore_7}
      "ore 8":                 {table: ore_chemistry,    material_code: ore_8}
      "ore 9":                 {table: ore_chemistry,    material_code: ore_9}
      "ore 10":                {table: ore_chemistry,    material_code: ore_10}
      "ore 11":                {table: ore_chemistry,    material_code: ore_11}
      "ore 12":                {table: ore_chemistry,    material_code: ore_12}

      "ore pellet 1":          {table: ore_chemistry,    material_code: pellet_1}
      "ore pellet 2":          {table: ore_chemistry,    material_code: pellet_2}

 
  sheet_config:
    COKE:                     {col_prefix: COKE_,          columns: A:J, header_row: 2, sheet_name: LAM COKE}
    DOLOMITE:                 {col_prefix: FLUX_1_,        columns: A:L, header_row: 2, sheet_name: DOLOMITE}
    DONIMALAI OVER SIZE RTRN: {col_prefix: ORE_11_,        columns: A:R, header_row: 2, sheet_name: DONIMALAI CLO OSIZE}
    LLOYDS LOW GRADE:         {col_prefix: ORE_12_,        columns: A:R, header_row: 2, sheet_name: LLOYDS LOW GRADE}
    GEOMIN_CLO:               {col_prefix: ORE_3_,         columns: A:S, header_row: 2, sheet_name: GEOMIN CLO}
    JRS_VENTURES:             {col_prefix: ORE_4_,         columns: A:S, header_row: 3, sheet_name: "JRS VENTURES "}
    LLOYDS_CLO:               {col_prefix: ORE_2_,         columns: A:R, header_row: 2, sheet_name: LLOYDS CLO}
    NMDC_DONOMALAI:           {col_prefix: ORE_1_,         columns: A:R, header_row: 2, sheet_name: NMDC DONOMALAI}
    NMDC_ROM:                 {col_prefix: ORE_5_,         columns: A:Q, header_row: 2, sheet_name: NMDC KIRANDUL}
    LLOYDS_OVERSIZE_CLO:      {col_prefix: ORE_6_,         columns: A:Q, header_row: 2, sheet_name: LLOYDS FINES OVER SIZE}
    BACHELI_FINES_OVERSIZE:   {col_prefix: ORE_7_,         columns: A:Q, header_row: 2, sheet_name: "BACHELI FINES OVER SIZE "}
    JAYASWAL_NECO:            {col_prefix: ORE_9_,         columns: B:R, header_row: 2, sheet_name: JAYASWAL NECO}
    NUT_COKE:                 {col_prefix: NUTCOKE_,       columns: A:I, header_row: 2, sheet_name: NUT COKE}
    PCI:                      {col_prefix: PCI_,           columns: A:F, header_row: 6, sheet_name: PCI ANALYSIS -02}
    QUARTZ:                   {col_prefix: FLUX_2_,        columns: A:I, header_row: 2, sheet_name: QUARTZ}
    SINTER:                   {col_prefix: SINTER_SP_02_,  columns: A:P, header_row: 2, sheet_name: SINTER}
    LIMESTONE:                {col_prefix: FLUX_3_,        columns: A:L, header_row: 2, sheet_name: LIMESTONE}
    LLOYDS_PELLET:            {col_prefix: LLOYDS_PELLET_, columns: A:R, header_row: 3, sheet_name: LLOYDS PELLET}
    ACORE_IND:                {col_prefix: ORE_8_,         columns: A:S, header_row: 3, sheet_name: ACORE IND.PVT LTD}
    GOMTI:                    {col_prefix: ORE_10_,        columns: A:R, header_row: 3, sheet_name: GOMTI}

  # BF-01 is intentionally restricted to this chemistry sheet.
  sinter_sheet_config:
    SINTER_BF01: {col_prefix: SINTER_SP_01_, columns: B:Q, header_row: 5, sheet_name: BF-SKIP SINTER, status_column: BUNKER NO.}
